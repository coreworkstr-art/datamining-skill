name: Release

# Push a tag such as v0.2.0 (it must match the version in src/datamining_skill/_version.py and
# have a section in CHANGELOG.md). The workflow builds the distributions, publishes them to PyPI
# when the repository variable PUBLISH_TO_PYPI is "true" (see CONTRIBUTING.md), and creates the
# GitHub release with the changelog section as its notes.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  build:
    name: build the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check the tag against the package version
        id: version
        run: |
          version=$(python -c "import pathlib, re; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/datamining_skill/_version.py').read_text()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract the release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/release_notes.py "$VERSION" > release-notes.md

      - name: Build and check the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Upload the distributions and the notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: build
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # trusted publishing: no API token is stored anywhere
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    name: create the GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the distributions and the notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "datamining-skill $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
